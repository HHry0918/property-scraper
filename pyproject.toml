[project]
name = "property-scraper"
version = "0.1.0"
description = "Property scraping pipeline using Scrapling, FastAPI, Celery, and LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core Data Engine & Validation
    "polars>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Anti-Bot Web Scraping
    "scrapling[fetchers]>=0.4.0",
    # FastAPI Web Server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Task Queue & Async Workers
    "celery>=5.4.0",
    "redis>=5.0.0",
    # Databases & ORM
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "pgvector>=0.2.5",
    # LangChain Ecosystem
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    # Utilities
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "ty>=0.0.75",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
